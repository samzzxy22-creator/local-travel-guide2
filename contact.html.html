<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Travel Guide - ติดต่อเรา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-emerald-600 flex items-center gap-2">
                <i class="fa-solid fa-compass"></i> ThaiLocalTrip
            </a>
            <div class="space-x-6 font-medium">
                <a href="index.html" class="text-gray-600 hover:text-emerald-600">หน้าแรก</a>
                <a href="listing.html" class="text-gray-600 hover:text-emerald-600">สถานที่ท่องเที่ยว</a>
                <a href="contact.html" class="text-emerald-600 font-semibold">ติดต่อเรา</a>
            </div>
        </div>
    </nav>

    <!-- Main Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white max-w-xl w-full p-8 rounded-2xl shadow-lg">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">ติดต่อสอบถามข้อมูล</h1>
                <p class="text-gray-500 text-sm mt-1">มีข้อสงสัยหรือสนใจแพ็กเกจท่องเที่ยวสอบถามเราได้ทันที</p>
            </div>

            <!-- Success Alert (Hidden by default) -->
            <div id="successAlert" class="hidden mb-6 bg-emerald-100 border border-emerald-400 text-emerald-700 px-4 py-3 rounded-lg text-sm text-center">
                <i class="fa-solid fa-circle-check mr-1"></i> ส่งข้อความสำเร็จ! เราจะติดต่อกลับโดยเร็วที่สุด
            </div>

            <form id="contactForm" onsubmit="validateForm(event)" class="space-y-4" novalidate>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="กรอกชื่อของคุณ">
                    <p id="nameError" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกชื่อ-นามสกุล</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="example@email.com">
                    <p id="emailError" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกอีเมลให้ถูกต้อง</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความ / รายละเอียดที่ต้องการสอบถาม</label>
                    <textarea id="message" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="พิมพ์ข้อความของคุณที่นี่..."></textarea>
                    <p id="messageError" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกข้อความ</p>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                    ส่งข้อความ
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-6 text-center">
        <p class="text-sm text-gray-400">&copy; 2026 ThaiLocalTrip. All rights reserved.</p>
    </footer>

    <!-- JavaScript Validation -->
    <script>
        function validateForm(event) {
            event.preventDefault();

            let isValid = true;

            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const message = document.getElementById('message');

            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const messageError = document.getElementById('messageError');
            const successAlert = document.getElementById('successAlert');

            // Reset errors
            nameError.classList.add('hidden');
            emailError.classList.add('hidden');
            messageError.classList.add('hidden');
            successAlert.classList.add('hidden');

            // Name Check
            if (name.value.trim() === '') {
                nameError.classList.remove('hidden');
                isValid = false;
            }

            // Email Check (Regex)
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value.trim())) {
                emailError.classList.remove('hidden');
                isValid = false;
            }

            // Message Check
            if (message.value.trim() === '') {
                messageError.classList.remove('hidden');
                isValid = false;
            }

            if (isValid) {
                successAlert.classList.remove('hidden');
                document.getElementById('contactForm').reset();
            }
        }
    </script>
</body>
</html>
