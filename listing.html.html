<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Travel Guide - รายการสถานที่ท่องเที่ยว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-emerald-600 flex items-center gap-2">
                <i class="fa-solid fa-compass"></i> ThaiLocalTrip
            </a>
            <div class="space-x-6 font-medium">
                <a href="index.html" class="text-gray-600 hover:text-emerald-600">หน้าแรก</a>
                <a href="listing.html" class="text-emerald-600 font-semibold">สถานที่ท่องเที่ยว</a>
                <a href="contact.html" class="text-gray-600 hover:text-emerald-600">ติดต่อเรา</a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-emerald-800 text-white py-12 text-center">
        <h1 class="text-3xl font-bold">ค้นหาสถานีท่องเที่ยวและสภาพอากาศ</h1>
        <p class="text-gray-200 mt-2">เลือกจังหวัดที่คุณต้องการเดินทางเพื่อตรวจสอบข้อมูลและอุณหภูมิปัจจุบัน</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/2 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อสถานที่ หรือ จังหวัด..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="w-full md:w-1/4">
                <select id="provinceFilter" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">ทุกจังหวัด</option>
                    <option value="เชียงใหม่">เชียงใหม่</option>
                    <option value="กระบี่">กระบี่</option>
                    <option value="กรุงเทพฯ">กรุงเทพฯ</option>
                    <option value="ภูเก็ต">ภูเก็ต</option>
                </select>
            </div>
        </div>

        <!-- Attractions Grid -->
        <div id="attractionContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Data will be populated via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 text-center mt-12">
        <p class="text-sm text-gray-400">&copy; 2026 ThaiLocalTrip. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Data & Open-Meteo API -->
    <script>
        const attractions = [
            {
                name: "ดอยอินทนนท์",
                province: "เชียงใหม่",
                lat: 18.5889,
                lon: 98.4878,
                image: "https://images.unsplash.com/photo-1598935898830-5465d625b6a7?auto=format&fit=crop&w=800&q=80",
                desc: "ยอดเขาที่สูงที่สุดในไทย ชมธรรมชาติและอากาศหนาว"
            },
            {
                name: "อ่าวไร่เลย์",
                province: "กระบี่",
                lat: 8.0141,
                lon: 98.8354,
                image: "https://images.unsplash.com/photo-1552465011-b4e21bf6e79a?auto=format&fit=crop&w=800&q=80",
                desc: "หาดทรายขาวและผาหินปูนสำหรับปีนผา"
            },
            {
                name: "วัดพระแก้ว",
                province: "กรุงเทพฯ",
                lat: 13.7516,
                lon: 100.4927,
                image: "https://images.unsplash.com/photo-1563492065599-3520f775eeed?auto=format&fit=crop&w=800&q=80",
                desc: "สถาปัตยกรรมไทยอันวิจิตรคู่บ้านคู่เมือง"
            },
            {
                name: "หาดป่าตอง",
                province: "ภูเก็ต",
                lat: 7.8943,
                lon: 98.2974,
                image: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=800&q=80",
                desc: "ชายหาดยอดนิยมสีสันยามค่ำคืนของภูเก็ต"
            }
        ];

        const container = document.getElementById('attractionContainer');
        const searchInput = document.getElementById('searchInput');
        const provinceFilter = document.getElementById('provinceFilter');

        async function fetchWeather(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                return data.current_weather.temperature;
            } catch (error) {
                console.error("Error fetching weather:", error);
                return "N/A";
            }
        }

        async function displayAttractions(filteredList) {
            container.innerHTML = '';
            for (let item of filteredList) {
                const temp = await fetchWeather(item.lat, item.lon);
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="relative">
                            <img src="${item.image}" alt="${item.name}" class="h-48 w-full object-cover">
                            <span class="absolute top-3 right-3 bg-white/90 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold shadow">
                                <i class="fa-solid fa-temperature-three-quarters text-orange-500 mr-1"></i> ${temp !== "N/A" ? temp + "°C" : "กำลังโหลด..."}
                            </span>
                        </div>
                        <div class="p-5">
                            <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-medium">${item.province}</span>
                            <h3 class="text-lg font-bold mt-2 mb-1">${item.name}</h3>
                            <p class="text-gray-600 text-xs mb-3">${item.desc}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0">
                        <button onclick="alert('จองทริปหรือดูข้อมูลเพิ่มเติมของ ${item.name}')" class="w-full bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white py-2 rounded-lg text-sm font-semibold transition">
                            ดูข้อมูลเพิ่มเติม
                        </button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function filterData() {
            const keyword = searchInput.value.toLowerCase();
            const selectedProvince = provinceFilter.value;

            const filtered = attractions.filter(item => {
                const matchKeyword = item.name.toLowerCase().includes(keyword) || item.province.toLowerCase().includes(keyword);
                const matchProvince = selectedProvince === "" || item.province === selectedProvince;
                return matchKeyword && matchProvince;
            });

            displayAttractions(filtered);
        }

        searchInput.addEventListener('input', filterData);
        provinceFilter.addEventListener('change', filterData);

        // Initial Load
        displayAttractions(attractions);
    </script>
</body>
</html>
